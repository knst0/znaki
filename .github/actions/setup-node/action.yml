name: Setup Node
description: Install pnpm and Node, restore the pnpm store cache and install the workspace.

inputs:
  registry-url:
    description: npm registry to configure for publishing
    required: false
    default: ""
  install:
    description: Run pnpm install --frozen-lockfile
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 24
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    - name: Install dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
