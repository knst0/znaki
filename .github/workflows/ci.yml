name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "test/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig*.json"
      - "tsdown.config.ts"
      - "vitest.config.ts"
      - "oxfmt.config.ts"
      - ".changeset/**"
      - ".github/actions/**"
      - ".github/scripts/**"
      - ".github/workflows/**"

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Verify
    permissions:
      contents: read
    uses: ./.github/workflows/check.yml
