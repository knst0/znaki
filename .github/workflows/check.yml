name: Check

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to verify. Defaults to the calling workflow's ref.
        required: false
        type: string
        default: ""
      linux-only:
        description: >-
          Run the cross-platform job on Linux alone. Use where the other
          platforms were already covered before the commit under test.
        required: false
        type: boolean
        default: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.linux-only && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-node

      - name: Format
        if: runner.os == 'Linux'
        run: pnpm fmt --check

      - name: Lint the release plumbing
        if: runner.os == 'Linux'
        run: .github/scripts/changeset.sh status

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:matrix

      - name: Build
        run: pnpm build

      - name: Pack
        if: runner.os == 'Linux'
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

  audit:
    name: Advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-node

      - name: pnpm audit
        run: pnpm audit --prod --audit-level high

  workflows:
    name: Workflows and scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Shell syntax and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          mapfile -t scripts < <(find .github/scripts -name '*.sh')
          for script in "${scripts[@]}"; do
            bash -n "$script"
          done
          shellcheck "${scripts[@]}"

      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color
